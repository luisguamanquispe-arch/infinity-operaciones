<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e40af" />
    <meta name="background-color" content="#1e40af" />
    <meta name="color-scheme" content="dark" />
    <title>Infinity Técnicos</title>
    <script src="config.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #1e40af;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #1e40af 0%, #1e3a8a 100%);
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      p {
        opacity: 0.9;
        text-align: center;
        line-height: 1.5;
        max-width: 320px;
        font-size: 0.95rem;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 28px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo" aria-hidden="true">📡</div>
    <h1>Infinity Técnicos</h1>
    <p id="msg">Preparando conexión…</p>
    <div class="spinner" aria-hidden="true"></div>
    <script>
      (function () {
        var server =
          (window.__INFINITY_SERVER__ || "https://infinity-operaciones-b3ij.onrender.com").replace(
            /\/$/,
            ""
          );
        var loginUrl = server + "/login?app=tecnico";
        var msg = document.getElementById("msg");
        var tries = 0;
        var maxTries = 18;

        function sleep(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms);
          });
        }

        function setMsg(text) {
          if (msg) msg.textContent = text;
        }

        function healthOk() {
          return fetch(server + "/api/health", {
            cache: "no-store",
            mode: "cors",
            credentials: "omit",
          })
            .then(function (r) {
              if (!r.ok) return false;
              return r.json().then(function (d) {
                return d && d.ok === true && d.service === "infinity-operaciones";
              });
            })
            .catch(function () {
              return false;
            });
        }

        function prefetchLogin() {
          return fetch(loginUrl, {
            cache: "no-store",
            mode: "cors",
            credentials: "include",
          }).catch(function () {});
        }

        function go() {
          /* El splash nativo sigue visible hasta que /login oculte Capacitor SplashScreen. */
          window.location.replace(loginUrl);
        }

        async function waitForServer() {
          while (tries < maxTries) {
            tries++;
            if (tries === 1) {
              setMsg("Despertando servidor…");
            } else if (tries <= 4) {
              setMsg("Conectando… (" + tries + "/" + maxTries + ")");
            } else {
              setMsg("El servidor tarda un poco. Espere… (" + tries + "/" + maxTries + ")");
            }

            var ok = await healthOk();
            if (ok) {
              await sleep(350);
              ok = await healthOk();
            }
            if (ok) {
              setMsg("Cargando aplicación…");
              await prefetchLogin();
              await sleep(200);
              go();
              return;
            }
            await sleep(tries < 4 ? 1200 : 1800);
          }
          setMsg("Abriendo aplicación…");
          go();
        }

        waitForServer();
      })();
    </script>
  </body>
</html>
