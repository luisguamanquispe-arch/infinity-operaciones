<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e40af" />
    <title>LGB Técnicos</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #1e40af, #1e3a8a);
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      p {
        opacity: 0.85;
        text-align: center;
        line-height: 1.5;
        max-width: 280px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 28px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">📡</div>
    <h1>LGB Técnicos</h1>
    <p>Conectando con el servidor de operaciones…</p>
    <div class="spinner" aria-hidden="true"></div>
    <script>
      // Respaldo si Capacitor no inyecta server.url
      setTimeout(function () {
        window.location.href =
          "https://infinity-operaciones.onrender.com/login?app=tecnico";
      }, 4000);
    </script>
  </body>
</html>
