name: Build and deploy Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm ci --ignore-scripts
            node scripts/prisma-run.cjs generate
            node scripts/prisma-run.cjs migrate deploy
          else
            echo "::warning::DATABASE_URL no está en GitHub Secrets — agrega el secret para migraciones automáticas."
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deploy hook enviado a Render."
          else
            echo "::error::RENDER_DEPLOY_HOOK no configurado en GitHub Secrets. Render NO recibirá la imagen nueva."
            echo "Render Dashboard → servicio → Settings → Deploy Hook → copiar URL → GitHub repo → Settings → Secrets → RENDER_DEPLOY_HOOK"
            exit 1
          fi
