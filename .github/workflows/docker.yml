name: Build and deploy Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm ci --ignore-scripts
            node scripts/prisma-run.cjs generate
            node scripts/prisma-run.cjs migrate deploy
          else
            echo "::warning::DATABASE_URL no está en GitHub Secrets — agrega el secret para migraciones automáticas."
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Render deploy (solo b3ij producción)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK no configurado en GitHub Secrets."
            echo "1) Render → servicio infinity-operaciones-b3ij (NO el …-3z9n) → Settings → Deploy Hook"
            echo "2) Copiar URL → GitHub → Settings → Secrets → RENDER_DEPLOY_HOOK"
            echo "3) Render → b3ij → Manual Deploy"
            exit 1
          fi
          if echo "$RENDER_DEPLOY_HOOK" | grep -qi '3z9n'; then
            echo "::error::RENDER_DEPLOY_HOOK apunta al servicio ORFAN 3z9n. Cámbielo al Deploy Hook de infinity-operaciones-b3ij."
            exit 1
          fi
          echo "Disparando deploy en producción b3ij…"
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          echo ""
          echo "Deploy hook enviado. Verificar: https://infinity-operaciones-b3ij.onrender.com/api/health"
          echo "Si 3z9n aún existe: Render → ese servicio → Settings → Delete / Suspend."
