# Render Blueprint — despliegue en un clic
# https://render.com/docs/blueprint-spec
#
# Uso: render.com → New → Blueprint → conectar repo GitHub
# La base de datos se conecta sola (sin configurar DATABASE_URL a mano).

databases:
  - name: infinity-db
    plan: free
    databaseName: infinity_ops
    user: infinity

services:
  - type: web
    name: infinity-operaciones
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:railway
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: UPLOAD_STORAGE
        value: local
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_PHONE
        value: "0995870168"
      - key: WHATSAPP_TEMPLATE_NAME
        value: ticket_cerrado
      - key: WHATSAPP_API_VERSION
        value: v21.0
