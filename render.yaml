# Render Blueprint — Infinity Operaciones (BD propia, NO compartir con Hoteles).
# GHCR debe ser PUBLICO: GitHub → Packages → infinity-operaciones → Public
# Verificar deploy: /api/health → service=infinity-operaciones y gitSha con hash reciente
#
# IMPORTANTE: no usar el nombre "infinity-db" (lo usa Infinity Hoteles y otros).
# Render Free solo permite 1 Postgres gratis por workspace. Como Hoteles ya usa
# el cupo free (infinity-db), Operaciones usa basic-256mb (~USD 6/mes).

databases:
  - name: infinity-ops-db
    plan: basic-256mb
    databaseName: infinity_ops
    user: infinity_ops

services:
  - type: web
    name: infinity-operaciones-b3ij
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/luisguamanquispe-arch/infinity-operaciones:latest
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-ops-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=160
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: UPLOAD_STORAGE
        value: local
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_PHONE
        value: "0995870168"
      - key: WHATSAPP_TEMPLATE_NAME
        value: ticket_cerrado
      - key: WHATSAPP_TEMPLATE_TECNICO
        value: ticket_asignado_tecnico
      - key: PUBLIC_APP_URL
        value: https://infinity-operaciones-b3ij.onrender.com/login?app=tecnico
      - key: WHATSAPP_API_VERSION
        value: v21.0
