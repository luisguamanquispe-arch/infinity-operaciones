# Render Blueprint — GitHub Actions compila la imagen Docker (evita OOM en 512 MB).
# Tras el primer push a main, la imagen queda en ghcr.io/luisguamanquispe-arch/infinity-operaciones:latest

databases:
  - name: infinity-db
    plan: free
    databaseName: infinity_ops
    user: infinity

services:
  - type: web
    name: infinity-operaciones
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/luisguamanquispe-arch/infinity-operaciones:latest
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=160
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: UPLOAD_STORAGE
        value: local
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_PHONE
        value: "0995870168"
      - key: WHATSAPP_TEMPLATE_NAME
        value: ticket_cerrado
      - key: WHATSAPP_TEMPLATE_TECNICO
        value: ticket_asignado_tecnico
      - key: PUBLIC_APP_URL
        value: https://infinity-operaciones.onrender.com/login?app=tecnico
      - key: WHATSAPP_API_VERSION
        value: v21.0
