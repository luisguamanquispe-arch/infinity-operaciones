<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinity Operaciones</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1e40af;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #1e40af 0%, #1e3a8a 100%);
      }
      p {
        margin: 0;
        text-align: center;
      }
      .titulo {
        font-size: 1.35rem;
        font-weight: 650;
      }
      .detalle {
        margin-top: 8px;
        opacity: 0.9;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin-top: 24px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <p class="titulo">Infinity Operaciones</p>
    <p class="detalle" id="msg">Preparando el programa…</p>
    <div class="spinner" aria-hidden="true"></div>
  </body>
</html>
